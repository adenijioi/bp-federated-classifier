<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BP Classification System</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand"><span class="heart">♥</span> BP Classifier</div>
    <div class="nav-links"><a href="#form">Predict</a><a href="#about">About</a></div>
  </nav>
  <section class="hero">
    <div class="hero-content">
      <h1>Blood Pressure Classification System</h1>
      <p>AI-powered federated machine learning for accurate BP prediction</p>
      <a href="#form" class="btn-primary">Check Your BP Status</a>
    </div>
  </section>
  <section id="form" class="form-section">
    <div class="container">
      <h2 class="section-title">Enter Your Health Data</h2>
      <div class="form-grid">
        <div class="form-group">
          <label>Age (years)</label>
          <input type="number" id="age" placeholder="e.g. 35" min="18" max="100">
        </div>
        <div class="form-group">
          <label>Gender</label>
          <select id="gender">
            <option value="1">Male</option>
            <option value="2">Female</option>
          </select>
        </div>
        <div class="form-group">
          <label>Height (cm)</label>
          <input type="number" id="height" placeholder="e.g. 170">
        </div>
        <div class="form-group">
          <label>Weight (kg)</label>
          <input type="number" id="weight" placeholder="e.g. 70">
        </div>
        <div class="form-group">
          <label>Systolic BP (mmHg)</label>
          <input type="number" id="ap_hi" placeholder="e.g. 120">
        </div>
        <div class="form-group">
          <label>Diastolic BP (mmHg)</label>
          <input type="number" id="ap_lo" placeholder="e.g. 80">
        </div>
        <div class="form-group">
          <label>Cholesterol</label>
          <select id="cholesterol">
            <option value="1">Normal</option>
            <option value="2">Above Normal</option>
            <option value="3">Well Above Normal</option>
          </select>
        </div>
        <div class="form-group">
          <label>Glucose</label>
          <select id="gluc">
            <option value="1">Normal</option>
            <option value="2">Above Normal</option>
            <option value="3">Well Above Normal</option>
          </select>
        </div>
        <div class="form-group">
          <label>Do you smoke?</label>
          <select id="smoke"><option value="0">No</option><option value="1">Yes</option></select>
        </div>
        <div class="form-group">
          <label>Do you drink alcohol?</label>
          <select id="alco"><option value="0">No</option><option value="1">Yes</option></select>
        </div>
        <div class="form-group">
          <label>Physically Active?</label>
          <select id="active"><option value="1">Yes</option><option value="0">No</option></select>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn-predict" onclick="predict()">Classify Blood Pressure</button>
      </div>
      <div id="result-card" class="result-card hidden"></div>
    </div>
  </section>
  <script src="/static/js/main.js"></script>
</body></html>
